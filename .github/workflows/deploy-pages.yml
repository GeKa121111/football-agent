name: Deploy Football Agent to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    # Manual runs from feature branches must never publish an unreviewed build.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      # Match the validation workflow: use the runner's native libraries and avoid apt mirror downloads.
      - name: Install Chromium for browser tests
        run: npx playwright install chromium
      - name: Run unit tests
        run: npm test
      - name: Run desktop and mobile browser tests
        run: npm run test:e2e
      - name: Check JavaScript syntax
        run: npm run check
      - name: Build for GitHub Pages
        run: npm run build -- --base=/${{ github.event.repository.name }}/
      - name: Add .nojekyll
        run: touch dist/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
