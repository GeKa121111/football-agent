name: Validate Football Agent

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      # ubuntu-latest already provides the native Chromium libraries used by this project.
      # Install only the browser binary so CI does not depend on apt mirror availability.
      - name: Install Chromium for browser tests
        run: npx playwright install chromium
      - name: Run unit tests
        run: npm test
      - name: Run desktop and mobile browser tests
        run: npm run test:e2e
      - name: Check JavaScript syntax
        run: npm run check
      - name: Build
        run: npm run build
