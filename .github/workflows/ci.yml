name: Validate Football Agent

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, rebuild/phase-1-foundation, rebuild/phase-2-ui]

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run unit tests
        run: npm test
      - name: Run desktop, mobile, accessibility and performance browser tests
        run: npm run test:e2e
      - name: Check JavaScript syntax
        run: npm run check
      - name: Build
        run: npm run build

  live-smoke:
    name: Smoke test the currently published GitHub Pages site
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test published site
        env:
          FOOTBALL_AGENT_LIVE_URL: https://geka121111.github.io/football-agent/
        run: npm run test:live
